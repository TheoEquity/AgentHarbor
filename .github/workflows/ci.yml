name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build, type check, and lint
        run: pnpm exec turbo build typecheck lint --filter='!@multica/docs' --filter='!@multica/mobile'

      - name: Test frontend
        run: pnpm exec turbo test --concurrency=1 --filter='!@multica/docs' --filter='!@multica/mobile'

      - name: Check frontend quality
        uses: ./.github/actions/frontend-quality

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: multica
          POSTGRES_USER: multica
          POSTGRES_PASSWORD: multica
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U multica -d multica"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://multica:multica@localhost:5432/multica?sslmode=disable
      REDIS_TEST_URL: redis://localhost:6379/1
      GOFLAGS: -count=1
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version: "~1.27.3"
          check-latest: true
          cache-dependency-path: server/go.sum

      - name: Verify generated SQL
        run: |
          make sqlc
          git diff --exit-code -- server/pkg/db/generated
          test -z "$(git ls-files --others --exclude-standard -- server/pkg/db/generated)"

      - name: Run migrations
        working-directory: server
        run: go run ./cmd/migrate up

      - name: Verify Go test wrapper
        run: bash scripts/test-go.test.sh

      - name: Test Go packages
        run: bash scripts/test-go.sh --race

      - name: Scan Go vulnerabilities
        working-directory: server
        run: go tool govulncheck ./...
